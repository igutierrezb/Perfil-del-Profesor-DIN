name: Deploy Perfil Profesor DIN - Firebase Hosting

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "firebase-hosting"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

        run: |
          set -euo pipefail

          test -n "$FIREBASE_API_KEY"
          test -n "$FIREBASE_AUTH_DOMAIN"
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_APP_ID"
          test -n "$GOOGLE_CLIENT_ID"

          rm -rf dist
          mkdir -p dist

          find . -maxdepth 1 -type f \
            ! -name 'firebase-config.js' \
            ! -name 'firebase.json' \
            -exec cp {} dist/ \;

          cat > dist/firebase-config.js <<EOF
          window.FIREBASE_CONFIG = {
            apiKey: "$FIREBASE_API_KEY",
            authDomain: "$FIREBASE_AUTH_DOMAIN",
            projectId: "$FIREBASE_PROJECT_ID",
            appId: "$FIREBASE_APP_ID"
          };

          window.PAD_GOOGLE_CLIENT_ID = "$GOOGLE_CLIENT_ID";
          window.PAD_ALLOWED_DOMAIN = "uteq.edu.mx";
          window.PAD_ADMIN_EMAIL = "ivan.gutierrez@uteq.edu.mx";
          EOF

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PERFIL_PROFESOR_DIN }}
          channelId: live
          projectId: perfil-profesor-din
