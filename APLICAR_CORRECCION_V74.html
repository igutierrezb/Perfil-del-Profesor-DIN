<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perfil DIN · Aplicar corrección V74</title>
<style>
:root{font-family:Inter,Segoe UI,system-ui,sans-serif;color:#17384d;background:#eef5f8}
body{margin:0;padding:32px}
main{max-width:980px;margin:auto;background:white;border:1px solid #d5e2e9;border-radius:18px;padding:26px;box-shadow:0 12px 35px rgba(17,64,87,.10)}
h1{margin:0 0 8px;font-size:1.55rem}
p{line-height:1.5}
.panel{margin:18px 0;padding:18px;border-radius:14px;background:#f7fafc;border:1px solid #dbe6ec}
input{display:block;width:100%;padding:12px;border:1px solid #bed1dc;border-radius:10px;background:white;box-sizing:border-box}
button{margin-top:12px;padding:11px 17px;border:0;border-radius:10px;background:#0b628f;color:white;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.ok{color:#16643a;font-weight:700} .bad{color:#a4382a;font-weight:700}
pre{white-space:pre-wrap;max-height:420px;overflow:auto;padding:14px;background:#102b3d;color:#eaf6fb;border-radius:12px;font-size:.78rem}
small{color:#647985}
</style>
</head>
<body>
<main>
<h1>Perfil DIN · Corrección secuencial V74</h1>
<p>Este archivo genera un <b>app.js corregido completo</b>. No modifica su archivo original y no envía información a Internet.</p>

<div class="panel">
  <b>1. Seleccione el app.js actual del repositorio</b>
  <input id="file" type="file" accept=".js,text/javascript">
  <button id="apply" disabled>2. Generar app.js corregido</button>
  <p id="status"><small>Esperando archivo.</small></p>
</div>

<pre id="log">La corrección debe completar 21 verificaciones.</pre>
</main>

<script>
const PATCHES=[{"label": "01 · índice inicial siempre en Programa 1", "old": "let currentProgramIndex=Number.isInteger(store.currentProgramIndex)?store.currentProgramIndex:0;", "new": "let currentProgramIndex=0;\nlet sequentialProfileConfirmed=false;\nlet sequentialCaptureConfirmed=false;\nlet sequentialExpectedProgramIndex=0;\nlet sequentialCaptureSignature='';", "mode": "once"}, {"label": "02 · no recuperar posición antigua desde respaldo A", "old": "currentProgramIndex=Number.isInteger(backup.currentProgramIndex)?backup.currentProgramIndex:currentProgramIndex;", "new": "currentProgramIndex=0;", "mode": "all"}, {"label": "03 · no recuperar posición antigua desde respaldo B", "old": "currentProgramIndex=Number.isInteger(backup.currentProgramIndex)?backup.currentProgramIndex:0;", "new": "currentProgramIndex=0;", "mode": "all"}, {"label": "04 · control secuencial en el núcleo", "old": "window.go=function(id,force=false){", "new": "/* V74 · flujo secuencial estricto integrado al núcleo */\nfunction sequentialApplies(){return editingAllowed()&&!isAdmin()}\nfunction captureStateSignature(){\n  try{return JSON.stringify({answers,programMeta})}catch(_){return ''}\n}\nfunction resetSequentialFlow(){\n  sequentialProfileConfirmed=false;\n  sequentialCaptureConfirmed=false;\n  sequentialExpectedProgramIndex=0;\n  sequentialCaptureSignature='';\n  currentProgramIndex=0;\n  store.currentProgramIndex=0;\n}\nfunction confirmSequentialProfile(){\n  sequentialProfileConfirmed=true;\n  sequentialCaptureConfirmed=false;\n  sequentialExpectedProgramIndex=0;\n  sequentialCaptureSignature='';\n  currentProgramIndex=0;\n  store.currentProgramIndex=0;\n}\nfunction invalidateSequentialProfile(){\n  if(!sequentialApplies())return;\n  resetSequentialFlow();\n}\nfunction invalidateSequentialCapture(){\n  if(!sequentialApplies())return;\n  sequentialCaptureConfirmed=false;\n  sequentialCaptureSignature='';\n}\nfunction sequentialCaptureIsConfirmed(){\n  if(!sequentialApplies())return true;\n  return sequentialCaptureConfirmed &&\n    sequentialCaptureSignature===captureStateSignature();\n}\nfunction confirmSequentialCapture(){\n  sequentialCaptureConfirmed=true;\n  sequentialCaptureSignature=captureStateSignature();\n}\nfunction updateSequentialNavLocks(){\n  const captureBtn=document.querySelector('.main-nav button[data-view=\"captura\"]');\n  const revisionBtn=document.querySelector('.main-nav button[data-view=\"revision\"]');\n\n  if(!sequentialApplies()){\n    if(captureBtn){\n      captureBtn.disabled=false;\n      captureBtn.classList.remove('locked');\n      captureBtn.removeAttribute('aria-disabled');\n      captureBtn.title='';\n    }\n    if(revisionBtn){\n      revisionBtn.disabled=false;\n      revisionBtn.classList.remove('locked');\n      revisionBtn.removeAttribute('aria-disabled');\n      revisionBtn.title='';\n    }\n    return;\n  }\n\n  const captureLocked=!sequentialProfileConfirmed;\n  const revisionLocked=!sequentialCaptureIsConfirmed() || !validateAll().ok;\n\n  if(captureBtn){\n    captureBtn.disabled=captureLocked;\n    captureBtn.classList.toggle('locked',captureLocked);\n    captureBtn.setAttribute('aria-disabled',captureLocked?'true':'false');\n    captureBtn.title=captureLocked\n      ?'Primero concluya y confirme Datos del profesor.'\n      :'Datos del profesor confirmados.';\n  }\n\n  if(revisionBtn){\n    revisionBtn.disabled=revisionLocked;\n    revisionBtn.classList.toggle('locked',revisionLocked);\n    revisionBtn.setAttribute('aria-disabled',revisionLocked?'true':'false');\n    revisionBtn.title=revisionLocked\n      ?'Primero concluya todos los programas en orden.'\n      :'Perfil por programa concluido.';\n  }\n}\n\nwindow.go=function(id,force=false){", "mode": "once"}, {"label": "05 · bloqueo real de navegación", "old": "window.go=function(id,force=false){\n  if(id==='admin'&&!isAdmin()){toast('Administración disponible únicamente para ivan.gutierrez@uteq.edu.mx');return}\n  if(id==='captura'&&!force){const p=validateProfile({visual:true,focusFirst:true});if(!p.ok){$('profileErrors').innerHTML=statusBox(p.errors,'Complete los datos obligatorios antes de continuar.');return}}\n  if(id==='revision'&&!force){\n    const v=validateAll();\n    if(!reviewAvailable()){showCaptureErrors(v.errors);return}\n  }\n  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');\n  document.querySelectorAll('.main-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));\n  if(id==='revision')buildPrint();\n  if(id==='admin')renderAdmin();\n  scrollTo(0,0);\n  if(id==='captura')requestAnimationFrame(showCaptureOrientationIfNeeded);\n}", "new": "window.go=function(id,force=false){\n  if(id==='admin'&&!isAdmin()){toast('Administración disponible únicamente para ivan.gutierrez@uteq.edu.mx');return}\n\n  // V74: las pestañas 2 y 3 NO pueden saltarse la secuencia mientras hay edición.\n  if(sequentialApplies()&&id==='captura'&&!sequentialProfileConfirmed){\n    toast('Primero concluya y confirme los Datos del profesor.');\n    return;\n  }\n  if(sequentialApplies()&&id==='revision'&&!sequentialCaptureIsConfirmed()){\n    toast('Primero concluya todos los programas del Perfil por programa.');\n    return;\n  }\n\n  if(id==='captura'&&!force){\n    const p=validateProfile({visual:true,focusFirst:true});\n    if(!p.ok){\n      $('profileErrors').innerHTML=statusBox(p.errors,'Complete los datos obligatorios antes de continuar.');\n      return;\n    }\n  }\n\n  if(id==='revision'){\n    const v=validateAll();\n\n    // Incluso force=true queda sometido a la secuencia cuando el profesor está editando.\n    if(sequentialApplies()&&(!sequentialCaptureIsConfirmed()||!v.ok)){\n      showCaptureErrors(v.errors);\n      toast('Complete y confirme toda la captura antes de pasar a revisión.');\n      return;\n    }\n\n    if(!force&&!reviewAvailable()){\n      showCaptureErrors(v.errors);\n      return;\n    }\n  }\n\n  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');\n  document.querySelectorAll('.main-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));\n  if(id==='revision')buildPrint();\n  if(id==='admin')renderAdmin();\n  scrollTo(0,0);\n  if(id==='captura')requestAnimationFrame(showCaptureOrientationIfNeeded);\n}", "mode": "once"}, {"label": "06 · confirmar Paso 1 y abrir Programa 1", "old": "  if(cloudAvailable&&currentUser){\n    try{await saveProfileToCloud(false)}catch(e){console.warn('Guardado previo al avance',e)}\n  }\n\n  renderCurrentProgram();", "new": "  if(cloudAvailable&&currentUser){\n    try{await saveProfileToCloud(false)}catch(e){console.warn('Guardado previo al avance',e)}\n  }\n\n  // V74: este botón es la única confirmación válida del Paso 1.\n  // Se conserva toda la información; solo se reinicia la posición de navegación.\n  confirmSequentialProfile();\n  persist({touch:false,schedule:false});\n  renderCurrentProgram();", "mode": "once"}, {"label": "07 · render seguro desde Programa 1", "old": "function renderCurrentProgram(){\n  const p=currentProgram();if(!p)return;", "new": "function renderCurrentProgram(){\n  // Mientras Paso 1 no esté confirmado, la vista preparada siempre es Programa 1.\n  if(sequentialApplies()&&!sequentialProfileConfirmed&&currentProgramIndex!==0){\n    currentProgramIndex=0;\n    store.currentProgramIndex=0;\n  }\n\n  if(currentProgramIndex<0||currentProgramIndex>=programs().length){\n    currentProgramIndex=0;\n    store.currentProgramIndex=0;\n  }\n\n  const p=currentProgram();if(!p)return;", "mode": "once"}, {"label": "08 · Anterior ya no hace Programa 1 → Programa 8", "old": "window.prevProgram=function(){\n  if(!canLeaveCurrentProgram())return;\n  currentProgramIndex=(currentProgramIndex-1+programs().length)%programs().length;\n  persist();renderCurrentProgram();\n  scrollTo({top:$('captura').offsetTop-55,behavior:'smooth'})\n}", "new": "window.prevProgram=function(){\n  if(currentProgramIndex<=0){\n    toast('Este es el primer programa educativo.');\n    return;\n  }\n\n  if(!canLeaveCurrentProgram())return;\n\n  currentProgramIndex--;\n  sequentialExpectedProgramIndex=currentProgramIndex;\n  invalidateSequentialCapture();\n  persist();\n  renderCurrentProgram();\n  scrollTo({top:$('captura').offsetTop-55,behavior:'smooth'})\n}", "mode": "once"}, {"label": "09 · Guardar y seguir obliga orden y validación total", "old": "window.saveAndNextProgram=function(){\n  if(!canLeaveCurrentProgram())return;\n  persist();toast('Programa guardado.');\n  if(currentProgramIndex>=programs().length-1){validateAndReview();return}\n  currentProgramIndex++;\n  persist();renderCurrentProgram();\n  scrollTo({top:$('captura').offsetTop-55,behavior:'smooth'})\n}", "new": "window.saveAndNextProgram=function(){\n  if(sequentialApplies()&&!sequentialProfileConfirmed){\n    toast('Primero concluya y confirme los Datos del profesor.');\n    return;\n  }\n\n  // El programa visible debe ser el siguiente programa esperado.\n  if(sequentialApplies()&&currentProgramIndex!==sequentialExpectedProgramIndex){\n    sequentialExpectedProgramIndex=currentProgramIndex;\n    invalidateSequentialCapture();\n  }\n\n  if(!canLeaveCurrentProgram())return;\n\n  persist();\n  toast('Programa guardado.');\n\n  if(currentProgramIndex>=programs().length-1){\n    const captureCheck=validateCapture();\n\n    // Programa 8 completo NO basta si existen pendientes en cualquier otro programa.\n    if(!captureCheck.ok){\n      invalidateSequentialCapture();\n      showCaptureErrors(captureCheck.errors);\n      toast('Todavía existen materias pendientes en otros programas.');\n      return;\n    }\n\n    validateAndReview(true);\n    return;\n  }\n\n  currentProgramIndex++;\n  sequentialExpectedProgramIndex=currentProgramIndex;\n  invalidateSequentialCapture();\n  persist();\n  renderCurrentProgram();\n  scrollTo({top:$('captura').offsetTop-55,behavior:'smooth'})\n}", "mode": "once"}, {"label": "10 · envío anterior no desbloquea Revisión al reabrir edición", "old": "function reviewAvailable(){\n  // Si Administración cerró la edición (o venció la fecha), el profesor puede\n  // seguir consultando y generar/imprimir el estado actual de su perfil.\n  return validateAll().ok || cfg.editingLocked || deadlinePassed() || submissionLockedForCurrentPeriod();\n}", "new": "function reviewAvailable(){\n  const complete=validateAll().ok;\n\n  // V74: un envío anterior NO autoriza saltar a Revisión durante una edición reabierta.\n  if(sequentialApplies()){\n    return complete && sequentialCaptureIsConfirmed();\n  }\n\n  // Solo lectura: conserva consulta/reimpresión del perfil existente.\n  return complete || cfg.editingLocked || deadlinePassed() || submissionLockedForCurrentPeriod();\n}", "mode": "once"}, {"label": "11 · Revisión solo desde último programa confirmado", "old": "window.validateAndReview=function(){\n  if(editingAllowed()) collectProfile();\n  persist();\n  const v=validateAll();\n  if(!reviewAvailable()){showCaptureErrors(v.errors);toast('Complete las materias pendientes.');return}\n  $('captureErrors').innerHTML='';\n  $('validation').innerHTML=v.ok\n    ?`<div class=\"status-box ok\"><b>Perfil completo.</b><br>La información puede formalizarse e imprimirse.</div>`\n    :`<div class=\"status-box info\"><b>Consulta en modo solo lectura.</b><br>La edición está cerrada, pero puede revisar e imprimir el perfil capturado.</div>`;\n  buildPrint();\n  window.go('revision',true)\n}", "new": "window.validateAndReview=function(fromSequentialFlow=false){\n  if(editingAllowed())collectProfile();\n\n  // Mientras el profesor está editando, ninguna pestaña o llamada directa puede\n  // confirmar Paso 2; únicamente Guardar y continuar desde el último programa.\n  if(sequentialApplies()&&!fromSequentialFlow){\n    toast('Concluya primero todos los programas en orden.');\n    return false;\n  }\n\n  persist();\n  const v=validateAll();\n\n  if(sequentialApplies()&&!v.ok){\n    invalidateSequentialCapture();\n    showCaptureErrors(v.errors);\n    toast('Complete las materias pendientes.');\n    return false;\n  }\n\n  if(!sequentialApplies()&&!reviewAvailable()){\n    showCaptureErrors(v.errors);\n    return false;\n  }\n\n  if(sequentialApplies())confirmSequentialCapture();\n\n  $('captureErrors').innerHTML='';\n  $('validation').innerHTML=v.ok\n    ?`<div class=\"status-box ok\"><b>Perfil completo.</b><br>La información puede formalizarse e imprimirse.</div>`\n    :`<div class=\"status-box info\"><b>Consulta en modo solo lectura.</b><br>La edición está cerrada, pero puede revisar e imprimir el perfil capturado.</div>`;\n\n  buildPrint();\n  window.go('revision',true);\n  return true;\n}", "mode": "once"}, {"label": "12 · pestaña 3 realmente disabled", "old": "function lockRevisionNav(){$('navRevision').classList.toggle('locked',!reviewAvailable())}", "new": "function lockRevisionNav(){\n  const el=$('navRevision');\n  if(!el)return;\n\n  const locked=sequentialApplies()\n    ?(!sequentialCaptureIsConfirmed() || !validateAll().ok)\n    :!reviewAvailable();\n\n  el.classList.toggle('locked',locked);\n  el.disabled=locked;\n  el.setAttribute('aria-disabled',locked?'true':'false');\n}", "mode": "once"}, {"label": "13 · salto por error conserva secuencia", "old": "  if(issues.length){\n    currentProgramIndex=issues[0].pi;\n    persist();", "new": "  if(issues.length){\n    currentProgramIndex=issues[0].pi;\n    sequentialExpectedProgramIndex=currentProgramIndex;\n    invalidateSequentialCapture();\n    persist();", "mode": "once"}, {"label": "14 · navegación a pendiente actualiza secuencia", "old": "window.goToCaptureIssue=function(pi,s,c,type='competence'){\n  currentProgramIndex=pi;\n  persist();", "new": "window.goToCaptureIssue=function(pi,s,c,type='competence'){\n  currentProgramIndex=pi;\n  sequentialExpectedProgramIndex=currentProgramIndex;\n  invalidateSequentialCapture();\n  persist();", "mode": "once"}, {"label": "15 · candados se recalculan siempre", "old": "  if(rBtn){\n    rBtn.classList.toggle('complete',validateAll().ok);\n    rBtn.classList.toggle('readable',reviewAvailable()&&!validateAll().ok);\n  }\n}", "new": "  if(rBtn){\n    rBtn.classList.toggle('complete',validateAll().ok);\n    rBtn.classList.toggle('readable',reviewAvailable()&&!validateAll().ok);\n  }\n\n  updateSequentialNavLocks();\n}", "mode": "once"}, {"label": "16 · editar Paso 1 invalida confirmación", "old": "    if(!e.target.matches('#perfil input,#perfil select,#perfil textarea'))return;\n    e.target.classList.remove('required-field-error');", "new": "    if(!e.target.matches('#perfil input,#perfil select,#perfil textarea'))return;\n    invalidateSequentialProfile();\n    e.target.classList.remove('required-field-error');", "mode": "once"}, {"label": "17 · change en Paso 1 invalida confirmación", "old": "    if(e.target.matches('#perfil input,#perfil select,#perfil textarea')){collectProfile();updateNavState()}", "new": "    if(e.target.matches('#perfil input,#perfil select,#perfil textarea')){\n      invalidateSequentialProfile();\n      collectProfile();\n      updateNavState()\n    }", "mode": "once"}, {"label": "18 · nueva sesión inicia desde Paso 1", "old": "  onAuthStateChanged(auth,async user=>{\n    currentUser=user;\n    remoteProfileLoaded=false;", "new": "  onAuthStateChanged(auth,async user=>{\n    currentUser=user;\n    resetSequentialFlow();\n    remoteProfileLoaded=false;", "mode": "once"}, {"label": "19 · reabrir edición conserva datos pero reinicia recorrido", "old": "    if(priorPeriod!==store.submittedPeriod || priorOverride!==store.individualEditEnabled || priorDisabled!==store.individualEditDisabled){\n      localStorage.setItem('PAD_UTEQ',JSON.stringify({...store,cfg,answers,programMeta,customPrograms,programOverrides,disabledPrograms,programAcronyms,commonRules,transversalRules,currentProgramIndex,lastSavedAt}));\n      applyEditState();updateNavState();", "new": "    if(priorPeriod!==store.submittedPeriod || priorOverride!==store.individualEditEnabled || priorDisabled!==store.individualEditDisabled){\n      const editingWasReopened=!priorOverride&&store.individualEditEnabled;\n\n      if(editingWasReopened&&!isAdmin()){\n        // NO se borran profile, answers ni programMeta.\n        // Se reinicia solamente Paso 1 -> Programa 1 -> ... -> Revisión.\n        resetSequentialFlow();\n\n        document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));\n        $('perfil')?.classList.add('active');\n        document.querySelectorAll('.main-nav button').forEach(\n          b=>b.classList.toggle('active',b.dataset.view==='perfil')\n        );\n      }\n\n      localStorage.setItem('PAD_UTEQ',JSON.stringify({...store,cfg,answers,programMeta,customPrograms,programOverrides,disabledPrograms,programAcronyms,commonRules,transversalRules,currentProgramIndex,lastSavedAt}));\n      applyEditState();\n      updateNavState();", "mode": "once"}, {"label": "20 · carga remota no reabre Programa 8", "old": "  saveUserBackup();\n  loadProfileValuesOnly();\n  renderCurrentProgram();", "new": "  saveUserBackup();\n  loadProfileValuesOnly();\n\n  if(sequentialApplies()&&!sequentialProfileConfirmed){\n    currentProgramIndex=0;\n    store.currentProgramIndex=0;\n  }\n\n  renderCurrentProgram();", "mode": "once"}, {"label": "21 · arranque visual prepara Programa 1", "old": "function init(){\n  loadProfile();\n  updatePeriodBadges();\n  initAuth();\n  renderCurrentProgram();", "new": "function init(){\n  loadProfile();\n  updatePeriodBadges();\n  initAuth();\n\n  // Solo reinicia posición/secuencia; no toca respuestas ni datos del profesor.\n  resetSequentialFlow();\n\n  renderCurrentProgram();", "mode": "once"}];
const file=document.getElementById('file');
const button=document.getElementById('apply');
const status=document.getElementById('status');
const log=document.getElementById('log');

file.addEventListener('change',()=>{button.disabled=!file.files.length});

function countOf(text,needle){
  if(!needle)return 0;
  return text.split(needle).length-1;
}
function downloadText(name,text){
  const blob=new Blob([text],{type:'text/javascript;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

button.addEventListener('click',async()=>{
  const f=file.files[0];
  if(!f)return;

  let text=await f.text();
  const messages=[];
  let applied=0;

  try{
    // Protección: no volver a aplicar V74 sobre un archivo ya actualizado.
    if(text.includes('V74 · flujo secuencial estricto integrado al núcleo')){
      throw new Error('Este app.js ya contiene la corrección V74.');
    }

    for(const p of PATCHES){
      const n=countOf(text,p.old);
      const required=p.mode==='all' ? 1 : 1;

      if(n<required){
        throw new Error(`${p.label}: no se encontró el bloque esperado. No se generó ningún archivo.`);
      }

      if(p.mode==='all'){
        text=text.split(p.old).join(p.new);
        messages.push(`✓ ${p.label} · ${n} coincidencia(s)`);
      }else{
        if(n!==1){
          throw new Error(`${p.label}: se esperó 1 coincidencia y se encontraron ${n}.`);
        }
        text=text.replace(p.old,p.new);
        messages.push(`✓ ${p.label}`);
      }
      applied++;
    }

    // Verificaciones funcionales mínimas del archivo producido.
    const checks=[
      ['índice inicial 0',"let currentProgramIndex=0;"],
      ['secuencia integrada',"function sequentialApplies()"],
      ['tab 2 bloqueable',"captureBtn.disabled=captureLocked;"],
      ['tab 3 bloqueable',"revisionBtn.disabled=revisionLocked;"],
      ['sin navegación circular',"if(currentProgramIndex<=0)"],
      ['revisión solo desde flujo',"validateAndReview(true);"],
      ['envío anterior no salta revisión',"if(sequentialApplies()){\n    return complete && sequentialCaptureIsConfirmed();"],
      ['reapertura vuelve a Paso 1',"const editingWasReopened=!priorOverride&&store.individualEditEnabled;"]
    ];

    for(const [name,needle] of checks){
      if(!text.includes(needle))throw new Error('Verificación final falló: '+name);
    }

    status.innerHTML=`<span class="ok">Correcto: ${applied}/21 cambios aplicados. Se descargará app.js listo para sustituir.</span>`;
    log.textContent=messages.join('\n')+'\n\n✓ Verificación final completada.';
    downloadText('app.js',text);
  }catch(err){
    status.innerHTML=`<span class="bad">${err.message}</span>`;
    log.textContent=messages.join('\n')+'\n\nERROR: '+err.message;
  }
});
</script>
