<path d="M31 108h103M82 59v28" stroke="#fff" stroke-width="9" stroke-linecap="round"/>

<!-- nave industrial, chimenea y sierra de techos -->
<path d="M33 183V132l31 18v-22l29 18v-24l29 18v-20l46 28v35H33Z" fill="url(#accent)"/>
<path d="M154 134v-31h17v41" fill="#E7F8F5"/>
