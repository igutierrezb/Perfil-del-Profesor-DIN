<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="División Industrial">
<defs>
  <linearGradient id="plate" x1="26" y1="16" x2="194" y2="205" gradientUnits="userSpaceOnUse">
    <stop stop-color="#082E4A"/>
    <stop offset=".52" stop-color="#0F6380"/>
    <stop offset="1" stop-color="#1A9489"/>
  </linearGradient>
  <linearGradient id="steel" x1="62" y1="42" x2="167" y2="168">
    <stop stop-color="#FFFFFF"/>
    <stop offset=".55" stop-color="#DDF6F2"/>
    <stop offset="1" stop-color="#A9DED8"/>
  </linearGradient>
  <linearGradient id="accent" x1="52" y1="143" x2="173" y2="198">
    <stop stop-color="#D5F2ED"/>
    <stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#031D2D" flood-opacity=".27"/>
  </filter>
</defs>

<!-- placa técnica octagonal -->
<path d="M58 12H162L208 58V162L162 208H58L12 162V58Z" fill="url(#plate)" filter="url(#shadow)"/>
<path d="M64 24H156L196 64V156L156 196H64L24 156V64Z" fill="none" stroke="#93D9D2" stroke-opacity=".48" stroke-width="2.5"/>

<!-- detalle de circuito / precisión -->
<g fill="none" stroke="#8CD7D0" stroke-width="3" stroke-linecap="round" opacity=".72">
  <path d="M34 72h24l11-11h18"/>
  <path d="M146 42h23l13 13v19"/>
  <path d="M38 168h27l10 10h22"/>
</g>
<g fill="#B7ECE6">
  <circle cx="34" cy="72" r="4"/><circle cx="87" cy="61" r="4"/>
  <circle cx="146" cy="42" r="4"/><circle cx="182" cy="74" r="4"/>
  <circle cx="38" cy="168" r="4"/><circle cx="97" cy="178" r="4"/>
</g>

<!-- engrane principal -->
<g transform="translate(148 82)" fill="none" stroke="url(#steel)" stroke-width="7" stroke-linecap="round">
  <circle r="30"/>
  <circle r="10" fill="#E9FAF7" stroke="none"/>
  <path d="M0-46v10M0 36v10M-46 0h10M36 0h10M-33-33l8 8M25 25l8 8M33-33l-8 8M-25 25l-8 8"/>
</g>

<!-- casco de seguridad -->
