  <linearGradient id="gear" x1="57" y1="148" x2="176" y2="226">
    <stop stop-color="#FFC933"/>
    <stop offset=".58" stop-color="#F3A900"/>
    <stop offset="1" stop-color="#DB8900"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0B2B43" flood-opacity=".16"/>
  </filter>
</defs>

<!-- tarjeta -->
<rect x="8" y="8" width="224" height="224" rx="42" fill="url(#bg)" stroke="#C8DBE7" stroke-width="3" filter="url(#shadow)"/>

