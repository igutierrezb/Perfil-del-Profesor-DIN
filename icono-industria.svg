<!-- engrane protagonista -->
<path d="M52 164h23c4-7 10-13 17-17l-5-23 21-7 10 21c8-1 16 0 24 3l14-19 19 12-9 22c6 6 10 13 12 21l23 3-2 22-23 2c-3 8-7 15-13 21l8 22-20 10-13-20c-8 2-16 2-24 0l-12 20-21-10 7-22c-6-6-11-13-14-21l-23-2-2-22 23-3c2-8 5-15 10-21l-10-21 18-13 15 18Z" fill="url(#gear)" stroke="#173B57" stroke-width="6" stroke-linejoin="round"/>
