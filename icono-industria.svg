  <circle r="20"/>
  <circle r="7" fill="#EAF9F6" stroke="none"/>
  <path d="M0-32v8M0 24v8M-32 0h8M24 0h8M-23-23l6 6M17 17l6 6M23-23l-6 6M-17 17l-6 6"/>
</g>

