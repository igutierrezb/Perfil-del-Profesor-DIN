<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="División Industrial">
<defs>
  <radialGradient id="bg" cx="36%" cy="28%" r="82%">
    <stop offset="0" stop-color="#27B3A6"/>
    <stop offset=".38" stop-color="#157A91"/>
    <stop offset="1" stop-color="#0A3456"/>
  </radialGradient>
  <linearGradient id="steel" x1="50" y1="35" x2="186" y2="196">
    <stop stop-color="#FFFFFF"/>
    <stop offset=".48" stop-color="#E8F8F5"/>
    <stop offset="1" stop-color="#A6DDD7"/>
  </linearGradient>
  <linearGradient id="accent" x1="88" y1="95" x2="176" y2="174">
    <stop stop-color="#FFD87A"/>
    <stop offset="1" stop-color="#F5A63A"/>
  </linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#052438" flood-opacity=".28"/>
  </filter>
</defs>

<!-- insignia circular -->
<circle cx="120" cy="120" r="105" fill="url(#bg)" filter="url(#shadow)"/>
<circle cx="120" cy="120" r="94" fill="none" stroke="#9CE1DA" stroke-width="3" stroke-opacity=".45"/>
<circle cx="120" cy="120" r="83" fill="none" stroke="#D7F3EF" stroke-width="1.5" stroke-opacity=".22"/>

<!-- anillo técnico segmentado -->
<g fill="none" stroke="#B8EAE4" stroke-width="5" stroke-linecap="round" opacity=".72">
  <path d="M120 29a91 91 0 0 1 57 20"/>
  <path d="M192 67a91 91 0 0 1 16 53"/>
  <path d="M194 160a91 91 0 0 1-42 41"/>
  <path d="M87 205a91 91 0 0 1-47-36"/>
  <path d="M31 132a91 91 0 0 1 15-55"/>
</g>

<!-- engrane -->
<g transform="translate(164 78)" fill="none" stroke="url(#steel)" stroke-width="6" stroke-linecap="round">
  <circle r="24"/>
  <circle r="8" fill="#EAF9F6" stroke="none"/>
  <path d="M0-37v8M0 29v8M-37 0h8M29 0h8M-26-26l6 6M20 20l6 6M26-26l-6 6M-20 20l-6 6"/>
</g>

<!-- brazo robótico articulado -->
<g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M61 151h25l18-34 29 10"/>
  <circle cx="86" cy="151" r="7" fill="#FFFFFF"/>
  <circle cx="104" cy="117" r="7" fill="#FFFFFF"/>
  <circle cx="133" cy="127" r="7" fill="#FFFFFF"/>
  <path d="M133 127l21-18"/>
</g>
<path d="M153 103l15 12-7 8-15-12Z" fill="url(#accent)"/>

<!-- nave/fábrica estilizada en perspectiva -->
<path d="M49 189v-39l27 15v-19l28 16v-20l28 16v-16l47 26v21H49Z" fill="#FFFFFF"/>
<path d="M50 189h129" stroke="#8AD5CE" stroke-width="4" stroke-linecap="round"/>
<rect x="61" y="169" width="14" height="20" rx="2" fill="#0D5273"/>
<rect x="84" y="169" width="14" height="20" rx="2" fill="#0D5273"/>
<rect x="108" y="169" width="14" height="20" rx="2" fill="#0D5273"/>
<rect x="145" y="166" width="18" height="23" rx="2" fill="#0D5273"/>

<!-- nodos digitales -->
<g fill="#FFD87A">
  <circle cx="53" cy="83" r="5"/>
  <circle cx="70" cy="60" r="4"/>
  <circle cx="196" cy="134" r="4"/>
</g>
<g stroke="#FFD87A" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M53 83h20l12-12"/>
  <path d="M196 134h-15l-9 9"/>
</g>
</svg>