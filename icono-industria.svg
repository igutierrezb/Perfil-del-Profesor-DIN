<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="División Industrial">
<defs>
  <linearGradient id="bg" x1="18" y1="10" x2="142" y2="150" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0D3858"/>
    <stop offset=".48" stop-color="#146B86"/>
    <stop offset="1" stop-color="#25A493"/>
  </linearGradient>
  <linearGradient id="metal" x1="38" y1="32" x2="126" y2="128">
    <stop stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#D7F4F0"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#06283D" flood-opacity=".24"/>
  </filter>
</defs>

<!-- placa industrial -->
<path d="M38 10H122L150 38V122L122 150H38L10 122V38Z" fill="url(#bg)" filter="url(#shadow)"/>
<path d="M43 20H117L140 43V117L117 140H43L20 117V43Z" fill="none" stroke="#8FD9D0" stroke-opacity=".55" stroke-width="2"/>

<!-- engrane superior derecho -->
