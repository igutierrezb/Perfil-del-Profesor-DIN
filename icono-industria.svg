<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="División Industrial">
<defs>
  <linearGradient id="bg" x1="18" y1="15" x2="215" y2="225">
    <stop stop-color="#F8FCFF"/>
    <stop offset=".58" stop-color="#EDF5FA"/>
    <stop offset="1" stop-color="#DDEAF2"/>
  </linearGradient>
  <linearGradient id="factory" x1="44" y1="67" x2="178" y2="158">
    <stop stop-color="#4C7DB6"/>
